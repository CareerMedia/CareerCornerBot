name: Update Career Corner data

on:
  schedule:
    # Mondays 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  export:
    runs-on: ubuntu-latest
    environment: CareerCornerBot
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets are present
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          CAREER_CORNER_PLAYLIST_ID: ${{ secrets.CAREER_CORNER_PLAYLIST_ID }}
        run: |
          missing=0
          if [ -z "${YOUTUBE_API_KEY}" ]; then
            echo "::error::Repository secret YOUTUBE_API_KEY is empty or not set."
            missing=1
          fi
          if [ -z "${YOUTUBE_CHANNEL_ID}" ] && [ -z "${CAREER_CORNER_PLAYLIST_ID}" ]; then
            echo "::error::Set either YOUTUBE_CHANNEL_ID or CAREER_CORNER_PLAYLIST_ID as a repository secret."
            missing=1
          fi
          echo "YOUTUBE_API_KEY set: $([ -n "${YOUTUBE_API_KEY}" ] && echo yes || echo no)"
          echo "YOUTUBE_CHANNEL_ID set: $([ -n "${YOUTUBE_CHANNEL_ID}" ] && echo yes || echo no)"
          echo "CAREER_CORNER_PLAYLIST_ID set: $([ -n "${CAREER_CORNER_PLAYLIST_ID}" ] && echo yes || echo no)"
          exit $missing

      - name: Fetch Career Corner videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          CAREER_CORNER_PLAYLIST_ID: ${{ secrets.CAREER_CORNER_PLAYLIST_ID }}
        run: python -u fetch_career_corner.py

      - name: Verify JSON was produced
        run: |
          if [ ! -f career_corner_videos.json ]; then
            echo "::error::career_corner_videos.json was not created. Check the logs above for the underlying error."
            exit 1
          fi
          echo "career_corner_videos.json size: $(wc -c < career_corner_videos.json) bytes"

      - name: Upload JSON as artifact
        uses: actions/upload-artifact@v6
        with:
          name: career_corner_videos
          path: career_corner_videos.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push updated JSON
        id: commit
        continue-on-error: true
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add career_corner_videos.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh career_corner_videos.json"

          # Rebase on top of any new commits to avoid non-fast-forward push failures.
          git pull --rebase origin "${{ github.ref_name }}" || true

          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            echo "::warning::Direct push failed (likely branch protection). The JSON is still available as the 'career_corner_videos' artifact on this run."
            exit 1
          fi

      - name: Note if push failed
        if: steps.commit.outcome == 'failure'
        run: |
          echo "Push step failed but the JSON artifact is uploaded. Download it from the Actions run summary."
